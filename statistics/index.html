<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>統計学実践ワークブック 学習ノート | R.Goto</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>


    <header class="stat-hero">
        <div class="container">
            <span class="hero-badge">
                <i class="fas fa-chart-bar"></i> 統計検定 準1級
            </span>
            <h1>統計学実践ワークブック<br>学習ノート</h1>
            <p class="hero-sub">全33章の学習内容をまとめています</p>
        </div>
    </header>

    <main class="stat-main">
        <div class="container">
            <div class="mode-toggle-bar">
                <button class="mode-btn active" data-mode="study">
                    <i class="fas fa-book-open"></i> 各章学習
                </button>
                <button class="mode-btn" data-mode="exam">
                    <i class="fas fa-pen-to-square"></i> 章末問題解説
                </button>
            </div>
            <div class="chapter-grid" id="chapter-grid">
                <!-- Generated by script.js -->
            </div>
            <div class="exam-grid" id="exam-grid" style="display:none;">
                <!-- Generated by script.js -->
            </div>
        </div>
    </main>

    <footer class="stat-footer">
        <div class="container">
            <p>&copy; 2026 R.Goto - 統計学学習ノート</p>
        </div>
    </footer>

    <script src="data.js"></script>
    <script src="script.js"></script>
</body>
</html>
